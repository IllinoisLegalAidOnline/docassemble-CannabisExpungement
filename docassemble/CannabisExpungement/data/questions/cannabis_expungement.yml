id: welcome
question: |
  Cannabis expungement
subquestion: |
  Welcome to Illinois Legal Aid Online's **Cannabis expungement** Easy Form.

  This program will help you create forms to clear cannabis-related convictions from your criminal record.
  
  The forms you make with this program can only be used in Illinois.
  
  To learn more, see ILAO's article about [**cannabis legalization and expungement**](https://www.illinoislegalaid.org/node/180146).
field: sees_nav_bar
---
id: about expungement
continue button field: about_expungement
question: |
  About cannabis expungement
subquestion: |
  Some cannabis convictions in Illinois from before June 25, 2019 (the day Illinois legalized cannabis) can be vacated and expunged. To 'expunge' means to erase the police and court records of the conviction.

  To vacate the cannabis conviction means to set aside the finding of guilt, as if it did not happen. To vacate and expunge an eligible cannabis conviction, a person must file a motion with the court.

  This program will create a *Motion to Vacate & Expunge Eligible Cannabis Convictions* that will include any of your eligible cannabis convictions. If you have any non-eligible convictions or arrests that did not end in conviction, you may be able to expunge them using ILAO's [**Expunge or seal criminal records Easy Form**](https://www.illinoislegalaid.org/node/30976).
  
  To learn more about the types of cannabis convictions that can be expunged, see ILAO's article about [**clearing cannabis convictions from a criminal record**](https://www.illinoislegalaid.org/node/165861).
---
