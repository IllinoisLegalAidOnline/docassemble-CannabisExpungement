---
reconsider: True
code: |
  elements_for_list_bundle = []
  for index, case in enumerate(qualified_convictions):
    if index > 4 and index % 8 == 6:
      case.index_for_additional = index
      case.additional_convictions.enabled = True
      elements_for_list_bundle.append(case.additional_convictions)
    list_bundle.elements = elements_for_list_bundle
  refresh_bundles = True
